<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>科學探究 • WhatsApp 風格</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { font-family: 'Noto Sans TC', system-ui, sans-serif; }
        .chat-header { background-color: #202c33; }
        .chat-area { background-color: #0b141a; }
        .chat-bubble { max-width: 75%; padding: 10px 14px; border-radius: 18px; position: relative; }
        .user-bubble { background-color: #005c4b; color: white; border-bottom-right-radius: 4px; }
        .ai-bubble { background-color: #202c33; color: #e9edef; border-bottom-left-radius: 4px; }
        .mind-avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: white; }
    </style>
</head>
<body class="bg-zinc-950 flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-[420px] bg-[#111b21] rounded-3xl overflow-hidden shadow-2xl border border-zinc-800">
        
        <!-- Header -->
        <div class="chat-header px-4 py-3 flex items-center justify-between text-white">
            <div class="flex items-center gap-x-3">
                <div class="w-10 h-10 bg-emerald-600 rounded-full flex items-center justify-center">
                    <i class="fa-solid fa-brain text-white text-xl"></i>
                </div>
                <div>
                    <div class="font-semibold text-lg">科學探究引導者</div>
                    <div class="text-xs text-emerald-400">五位偉大心靈 • Gemini 驅動</div>
                </div>
            </div>
            <button onclick="resetChat()" class="text-emerald-400 hover:text-white">
                <i class="fa-solid fa-redo"></i>
            </button>
        </div>

        <!-- Chat Area -->
        <div id="chat-area" class="h-[520px] overflow-y-auto p-4 flex flex-col gap-y-3">
            <!-- 訊息動態加入 -->
        </div>

        <!-- Input -->
        <div class="bg-[#202c33] px-4 py-3 flex items-center gap-x-2">
            <input id="user-input" type="text" placeholder="輸入你的想法..." 
                   class="flex-1 bg-[#2a3942] text-white rounded-full px-5 py-2.5 text-sm focus:outline-none"
                   onkeypress="if (event.key === 'Enter') sendMessage()">
            <button onclick="sendMessage()" 
                    class="w-10 h-10 bg-emerald-600 hover:bg-emerald-700 rounded-full flex items-center justify-center">
                <i class="fa-solid fa-paper-plane text-white"></i>
            </button>
        </div>
    </div>

    <script>
        // ==================== 請在這裡輸入你的 Gemini API Key ====================
        const GEMINI_API_KEY = "AIzaSyBe1G6tcg344vIW2zrIR4R-_7bMzk11NKA";   // ←←←←←←←←←←←←←←←←←←←←←←←←←←←←
        // =======================================================================

        let conversationHistory = [];

        const SYSTEM_PROMPT = `你是「科學探究對話引導者」，使用五位偉大心靈（蘇格拉底、笛卡兒、亞里士多德、黑格爾、圖爾敏）引導學生進行科學探究。

每輪只由一位心靈發言。只提供歷史實驗的數據，不要直接給結論。要求學生自己推理。`;

        function addMessage(text, isUser = false, mind = null) {
            const chatArea = document.getElementById('chat-area');
            const messageDiv = document.createElement('div');

            if (isUser) {
                messageDiv.innerHTML = `
                    <div class="flex justify-end">
                        <div class="chat-bubble user-bubble max-w-[75%]">
                            <div>${text}</div>
                        </div>
                    </div>
                `;
            } else {
                const mindColors = {
                    "蘇格拉底": "#3b82f6", "笛卡兒": "#8b5cf6", "亞里士多德": "#10b981",
                    "黑格爾": "#ef4444", "圖爾敏": "#f59e0b"
                };
                const color = mindColors[mind] || "#64748b";
                
                messageDiv.innerHTML = `
                    <div class="flex gap-x-2">
                        <div class="mind-avatar flex-shrink-0" style="background-color: ${color}">
                            ${mind ? mind[0] : "?"}
                        </div>
                        <div class="max-w-[75%]">
                            <div class="text-xs font-medium mb-1" style="color: ${color}">${mind}</div>
                            <div class="chat-bubble ai-bubble">${text}</div>
                        </div>
                    </div>
                `;
            }
            chatArea.appendChild(messageDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        async function callGemini(userMessage) {
            if (GEMINI_API_KEY === "請把你的 Gemini API Key 貼在這裡") {
                alert("請先在程式碼中輸入你的 Gemini API Key！");
                return "請先輸入 API Key";
            }

            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-pro:generateContent?key=${GEMINI_API_KEY}`;

            const payload = {
                contents: [
                    { role: "user", parts: [{ text: SYSTEM_PROMPT }] },
                    ...conversationHistory,
                    { role: "user", parts: [{ text: userMessage }] }
                ],
                generationConfig: {
                    temperature: 0.7,
                    maxOutputTokens: 800
                }
            };

            try {
                const response = await fetch(url, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                
                if (data.candidates && data.candidates[0]) {
                    return data.candidates[0].content.parts[0].text;
                } else {
                    return "抱歉，AI 目前無法回應。";
                }
            } catch (error) {
                console.error(error);
                return "發生錯誤，請檢查 API Key 是否正確。";
            }
        }

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if (!text) return;

            addMessage(text, true);
            conversationHistory.push({ role: "user", parts: [{ text: text }] });
            input.value = '';

            // 顯示「正在輸入...」
            const loadingDiv = document.createElement('div');
            loadingDiv.id = 'loading';
            loadingDiv.innerHTML = `<div class="flex gap-x-2"><div class="mind-avatar bg-zinc-600">...</div><div class="chat-bubble ai-bubble">思考中...</div></div>`;
            document.getElementById('chat-area').appendChild(loadingDiv);

            const aiResponse = await callGemini(text);
            
            document.getElementById('loading').remove();
            
            // 簡單判斷目前是哪位心靈（可後續優化）
            let currentMind = "蘇格拉底";
            if (aiResponse.includes("笛卡兒") || aiResponse.includes("懷疑")) currentMind = "笛卡兒";
            else if (aiResponse.includes("亞里士多德") || aiResponse.includes("歷史")) currentMind = "亞里士多德";
            else if (aiResponse.includes("黑格爾") || aiResponse.includes("矛盾")) currentMind = "黑格爾";
            else if (aiResponse.includes("圖爾敏") || aiResponse.includes("主張")) currentMind = "圖爾敏";

            addMessage(aiResponse, false, currentMind);
            conversationHistory.push({ role: "model", parts: [{ text: aiResponse }] });
        }

        function resetChat() {
            document.getElementById('chat-area').innerHTML = '';
            conversationHistory = [];
            
            setTimeout(() => {
                addMessage("你好！今天我們來探討「植物生長時增加的質量到底從哪裡來？」這個問題。請先分享你的想法。", false, "蘇格拉底");
            }, 400);
        }

        // 初始化
        function init() {
            setTimeout(() => {
                addMessage("你好！今天我們來探討「植物生長時增加的質量到底從哪裡來？」這個問題。請先分享你的想法。", false, "蘇格拉底");
            }, 600);
        }

        window.onload = init;
    </script>
</body>
</html>
