<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>科學探究 • WhatsApp 風格</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { font-family: 'Noto Sans TC', system-ui, sans-serif; }
        .chat-header { background-color: #202c33; }
        .chat-area { background-color: #0b141a; }
        .chat-bubble { max-width: 75%; padding: 10px 14px; border-radius: 18px; position: relative; word-wrap: break-word; }
        .user-bubble { background-color: #005c4b; color: white; border-bottom-right-radius: 4px; }
        .ai-bubble { background-color: #202c33; color: #e9edef; border-bottom-left-radius: 4px; }
        .mind-avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: white; }
    </style>
</head>
<body class="bg-zinc-950 flex items-center justify-center min-h-screen p-4">

    <!-- API Key Modal -->
    <div id="api-modal" class="fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center z-50">
        <div class="bg-zinc-900 rounded-2xl p-6 w-full max-w-md mx-4">
            <h2 class="text-xl font-bold mb-4 text-center">請輸入 Gemini API Key</h2>
            <input id="api-key-input" type="password" class="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-4 py-3 text-white mb-4 focus:outline-none focus:border-emerald-500" placeholder="AIzaSy...">
            <button onclick="saveApiKey()" class="w-full bg-emerald-600 hover:bg-emerald-700 py-3 rounded-xl font-medium">開始使用</button>
        </div>
    </div>

    <div class="w-full max-w-[420px] bg-[#111b21] rounded-3xl overflow-hidden shadow-2xl border border-zinc-800">
        <div class="chat-header px-4 py-3 flex items-center justify-between text-white">
            <div class="flex items-center gap-x-3">
                <div class="w-10 h-10 bg-emerald-600 rounded-full flex items-center justify-center"><i class="fa-solid fa-brain text-white text-xl"></i></div>
                <div>
                    <div class="font-semibold text-lg">科學探究引導者</div>
                    <div class="text-xs text-emerald-400">Powered by Gemini 2.5</div>
                </div>
            </div>
            <div class="flex items-center gap-x-2">
                <button onclick="changeApiKey()" class="text-xs px-3 py-1 bg-zinc-700 hover:bg-zinc-600 rounded-full">更換 Key</button>
                <button onclick="resetChat()" class="text-emerald-400 hover:text-white"><i class="fa-solid fa-redo"></i></button>
            </div>
        </div>

        <div id="chat-area" class="h-[520px] overflow-y-auto p-4 flex flex-col gap-y-3"></div>

        <div class="bg-[#202c33] px-4 py-3 flex items-center gap-x-2">
            <input id="user-input" type="text" placeholder="輸入你的想法..." class="flex-1 bg-[#2a3942] text-white rounded-full px-5 py-2.5 text-sm focus:outline-none" onkeypress="if (event.key === 'Enter') sendMessage()">
            <button onclick="sendMessage()" class="w-10 h-10 bg-emerald-600 hover:bg-emerald-700 rounded-full flex-shrink-0"><i class="fa-solid fa-paper-plane text-white"></i></button>
        </div>
    </div>

    <script>
        let GEMINI_API_KEY = "";
        let conversationHistory = [];

        const SYSTEM_PROMPT = `你是「科學探究引導者」，代表一群科學家引導學生進行科學探究。

嚴格規則：
- 每次回應只輸出「一個問題」或「一個陳述句」。
- 回應長度必須在 80 字以內。
- 絕對不要提及任何特定哲學家名字。
- 統一使用「科學家」作為身份。
- 直接輸出內容，不要說「科學家在此」或類似介紹語。
- 只專注引導學生思考實驗設計、數據意義或科學過程。`;

        function escapeHTML(str) {
            let escaped = str.replace(/[&<>'"]/g, tag => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[tag]));
            return escaped.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
        }

        function addMessage(text, isUser = false, mind = null) {
            const chatArea = document.getElementById('chat-area');
            const div = document.createElement('div');
            const safeText = escapeHTML(text);

            if (isUser) {
                div.innerHTML = `<div class="flex justify-end"><div class="chat-bubble user-bubble max-w-[75%]"><div>${safeText}</div></div></div>`;
            } else {
                // 統一使用「科學家」
                div.innerHTML = `
                    <div class="flex gap-x-2">
                        <div class="mind-avatar flex-shrink-0" style="background-color:#10b981">科</div>
                        <div class="max-w-[75%]">
                            <div class="text-xs font-medium mb-1" style="color:#10b981">科學家</div>
                            <div class="chat-bubble ai-bubble">${safeText}</div>
                        </div>
                    </div>`;
            }
            chatArea.appendChild(div);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        async function callGemini() {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`;
            const payload = { system_instruction: { parts: [{ text: SYSTEM_PROMPT }] }, contents: conversationHistory, generationConfig: { temperature: 0.7, maxOutputTokens: 250 } };

            const res = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
            if (!res.ok) { const err = await res.json(); return `錯誤：${err.error?.message || res.statusText}`; }
            const data = await res.json();
            return data.candidates[0].content.parts[0].text;
        }

        async function sendMessage() {
            if (!GEMINI_API_KEY) { alert("請先輸入 API Key"); return; }
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if (!text) return;

            addMessage(text, true);
            conversationHistory.push({ role: "user", parts: [{ text: text }] });
            input.value = '';

            const chatArea = document.getElementById('chat-area');
            const loading = document.createElement('div');
            loading.id = 'loading';
            loading.innerHTML = `<div class="flex gap-x-2"><div class="mind-avatar bg-zinc-600"><i class="fa-solid fa-ellipsis fa-beat"></i></div><div class="chat-bubble ai-bubble">思考中...</div></div>`;
            chatArea.appendChild(loading);
            chatArea.scrollTop = chatArea.scrollHeight;

            const response = await callGemini();
            document.getElementById('loading').remove();

            addMessage(response, false, "科學家");
            conversationHistory.push({ role: "model", parts: [{ text: response }] });
        }

        function saveApiKey() {
            const key = document.getElementById('api-key-input').value.trim();
            if (!key) { alert("請輸入 API Key"); return; }
            GEMINI_API_KEY = key;
            document.getElementById('api-modal').style.display = 'none';
            setTimeout(() => {
                const initText = "你好！今天我們來探討「植物生長時增加的質量到底從哪裡來？」這個問題。請先分享你的想法。";
                addMessage(initText, false, "科學家");
                conversationHistory.push({ role: "model", parts: [{ text: initText }] });
            }, 300);
        }

        function changeApiKey() { document.getElementById('api-modal').style.display = 'flex'; }
        function resetChat() {
            document.getElementById('chat-area').innerHTML = '';
            conversationHistory = [];
            const initText = "你好！今天我們來探討「植物生長時增加的質量到底從哪裡來？」這個問題。請先分享你的想法。";
            addMessage(initText, false, "科學家");
            conversationHistory.push({ role: "model", parts: [{ text: initText }] });
        }

        window.onload = () => { document.getElementById('api-modal').style.display = 'flex'; };
    </script>
</body>
</html>
