<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electromagnet Simulation</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { margin: 0; overflow: hidden; background-color: white; }
        /* Custom scrollbar for sidebar */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* Cursor Utilities */
        .cursor-grab { cursor: grab; }
        .cursor-grabbing { cursor: grabbing; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- ICON COMPONENTS (SVG Replacements for Lucide) ---
        const IconWrapper = ({ children, className, onClick }) => (
            <div className={`flex items-center justify-center ${className}`} onClick={onClick}>{children}</div>
        );

        const Zap = ({ size = 24, className }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
        );
        const RotateCcw = ({ size = 24, className }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>
        );
        const Settings = ({ size = 24, className }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.47a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></svg>
        );
        const MousePointer2 = ({ size = 24, className }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"></path>
                <path d="M13 13l6 6"></path>
            </svg>
        );
        const Hand = ({ size = 24, className }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M18 11V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v0"></path><path d="M14 10V4a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v2"></path><path d="M10 10.5V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v8"></path><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"></path></svg>
        );
        const Save = ({ size = 24, className }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
        );
        const Trash2 = ({ size = 24, className }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
        );

        // --- MAIN APP COMPONENT ---
        const SimulationLayout = () => {
            // --- State Management ---
            const [toolMode, setToolMode] = useState('select'); 
            const [isHoveringSwitch, setIsHoveringSwitch] = useState(false);
            const [isHoveringMagnet, setIsHoveringMagnet] = useState(false);
            
            // Canvas Dimensions for Physics Calc
            const [canvasSize, setCanvasSize] = useState({ w: 0, h: 0 });

            // Panning State
            const [panOffset, setPanOffset] = useState({ x: 0, y: 0 });
            const [isPanning, setIsPanning] = useState(false);
            const lastMousePos = useRef({ x: 0, y: 0 });

            // Magnet Drag State
            const [magnetOffset, setMagnetOffset] = useState({ x: 0, y: 0 });
            const [isDraggingMagnet, setIsDraggingMagnet] = useState(false);
            const dragStartPos = useRef({ x: 0, y: 0 });
            const magnetStartOffset = useRef({ x: 0, y: 0 });
            
            // Circuit State
            const [isSwitchClosed, setIsSwitchClosed] = useState(false);

            // Simulation Parameters
            const [params, setParams] = useState({
                turns: 20,      // 20, 40, 60
                cells: 1,       // 1, 2, 3
                core: 'iron',   // 'iron', 'wood'
            });

            // Calculated State
            const [clipCount, setClipCount] = useState(0);
            const heldClipsRef = useRef(0);
            const currentDistanceRef = useRef(0);
            
            // Data Logging State
            const [dataLog, setDataLog] = useState([]);

            // Canvas Reference
            const canvasRef = useRef(null);
            const requestRef = useRef();
            const containerRef = useRef(null);

            // Constants
            const ZOOM_SCALE = 0.85;

            // --- Real-time Calculations for Table ---
            // We calculate these in the render body so the table updates instantly
            let liveDistance = 0;
            if (canvasSize.h > 0) {
                const centerY = canvasSize.h / 2 - 60;
                const magnetBaseX = canvasSize.w * 0.65;
                const magnetX = magnetBaseX + magnetOffset.x;
                const magnetY = centerY + magnetOffset.y; 
                const magnetLen = 280; 
                const magnetBottomY = magnetY + magnetLen / 2;
                const pileY = canvasSize.h - 30; 
                const pileX = magnetBaseX;
                
                const dx = pileX - magnetX;
                const dy = pileY - magnetBottomY;
                const distPx = Math.sqrt(dx*dx + dy*dy);
                // Unit conversion
                liveDistance = Math.round(distPx / 5);
            }
            
            const liveCurrent = isSwitchClosed ? (params.cells * 0.5).toFixed(1) : "0.0";

            // --- Physics Logic ---
            useEffect(() => {
                if (!isSwitchClosed || params.core === 'wood') {
                    heldClipsRef.current = 0;
                    setClipCount(0);
                }
            }, [params, isSwitchClosed]);

            // --- Interaction Handlers ---
            const handleParamChange = (key, value) => {
                setParams(prev => ({ ...prev, [key]: value }));
            };

            const handleRecord = () => {
                const newEntry = {
                    id: Date.now(),
                    turns: params.turns,
                    cells: params.cells,
                    current: liveCurrent,
                    distance: liveDistance,
                    clips: clipCount,
                    core: params.core
                };
                setDataLog(prev => [...prev, newEntry]);
            };

            const handleClearData = () => {
                setDataLog([]);
            };

            const getSwitchBounds = (width, height) => {
                const centerY = height / 2 - 60; 
                const compX = width * 0.15; 
                const switchY = centerY; 
                
                return {
                    minX: compX - 40,
                    maxX: compX + 40,
                    minY: switchY - 60,
                    maxY: switchY + 60
                };
            };

            const getMagnetBounds = (width, height) => {
                const centerY = height / 2 - 60;
                const magnetX = width * 0.65;
                const magnetLen = 280;
                
                const curX = magnetX + magnetOffset.x;
                const curY = centerY + magnetOffset.y;

                return {
                    minX: curX - 40,
                    maxX: curX + 40,
                    minY: curY - magnetLen/2,
                    maxY: curY + magnetLen/2
                };
            };

            const getTransformedMousePos = (e, canvas) => {
                const rect = canvas.getBoundingClientRect();
                const rawX = e.clientX - rect.left;
                const rawY = e.clientY - rect.top;
                
                const width = canvas.width;
                const height = canvas.height;
                const centerX = width / 2;
                const centerY = height / 2;

                const worldX = (rawX - centerX) / ZOOM_SCALE + centerX - panOffset.x;
                const worldY = (rawY - centerY) / ZOOM_SCALE + centerY - panOffset.y;

                return { x: worldX, y: worldY, rawX: rawX, rawY: rawY };
            };

            const handleCanvasMouseDown = (e) => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const pos = getTransformedMousePos(e, canvas);

                if (toolMode === 'pan') {
                    setIsPanning(true);
                    lastMousePos.current = { x: pos.rawX, y: pos.rawY };
                    return;
                }

                const magBounds = getMagnetBounds(canvas.width, canvas.height);
                if (pos.x > magBounds.minX && pos.x < magBounds.maxX && pos.y > magBounds.minY && pos.y < magBounds.maxY) {
                    setIsDraggingMagnet(true);
                    dragStartPos.current = { x: pos.rawX, y: pos.rawY }; 
                    magnetStartOffset.current = { ...magnetOffset };
                    return;
                }

                const swBounds = getSwitchBounds(canvas.width, canvas.height);
                if (pos.x > swBounds.minX && pos.x < swBounds.maxX && pos.y > swBounds.minY && pos.y < swBounds.maxY) {
                    setIsSwitchClosed(!isSwitchClosed);
                }
            };

            const handleCanvasMouseMove = (e) => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const pos = getTransformedMousePos(e, canvas);

                if (isPanning && toolMode === 'pan') {
                    const dx = (pos.rawX - lastMousePos.current.x) / ZOOM_SCALE;
                    const dy = (pos.rawY - lastMousePos.current.y) / ZOOM_SCALE;
                    setPanOffset(prev => ({ x: prev.x + dx, y: prev.y + dy }));
                    lastMousePos.current = { x: pos.rawX, y: pos.rawY };
                    return;
                }

                if (isDraggingMagnet) {
                    const dx = (pos.rawX - dragStartPos.current.x) / ZOOM_SCALE;
                    const dy = (pos.rawY - dragStartPos.current.y) / ZOOM_SCALE;
                    
                    let newX = magnetStartOffset.current.x + dx;
                    let newY = magnetStartOffset.current.y + dy;

                    newX = Math.max(-400, Math.min(400, newX));

                    const height = canvas.height;
                    const centerY = height / 2 - 60;
                    const magnetLen = 280;
                    const pileY = height - 30;
                    
                    const maxY = pileY - centerY - magnetLen/2;
                    const minY = -300; 

                    newY = Math.max(minY, Math.min(maxY, newY));

                    setMagnetOffset({ x: newX, y: newY });
                    return;
                }

                const swBounds = getSwitchBounds(canvas.width, canvas.height);
                const magBounds = getMagnetBounds(canvas.width, canvas.height);

                if (pos.x > swBounds.minX && pos.x < swBounds.maxX && pos.y > swBounds.minY && pos.y < swBounds.maxY) {
                    setIsHoveringSwitch(true);
                    setIsHoveringMagnet(false);
                } else if (pos.x > magBounds.minX && pos.x < magBounds.maxX && pos.y > magBounds.minY && pos.y < magBounds.maxY) {
                    setIsHoveringMagnet(true);
                    setIsHoveringSwitch(false);
                } else {
                    setIsHoveringSwitch(false);
                    setIsHoveringMagnet(false);
                }
            };

            const handleCanvasMouseUp = () => {
                setIsPanning(false);
                setIsDraggingMagnet(false);
            };

            const handleCanvasMouseLeave = () => {
                setIsPanning(false);
                setIsDraggingMagnet(false);
            };

            const getCursorClass = () => {
                if (toolMode === 'pan') {
                    return isPanning ? 'cursor-grabbing' : 'cursor-grab';
                }
                if (isDraggingMagnet) return 'cursor-grabbing'; 
                if (isHoveringSwitch) return 'cursor-pointer';
                if (isHoveringMagnet) return 'cursor-grab';
                return 'cursor-default';
            };

            // --- Animation & Drawing ---
            const animate = (time) => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                const width = canvas.width;
                const height = canvas.height;

                ctx.setTransform(1, 0, 0, 1, 0, 0);
                ctx.clearRect(0, 0, width, height);

                ctx.translate(width / 2, height / 2);
                ctx.scale(ZOOM_SCALE, ZOOM_SCALE);
                ctx.translate(-width / 2, -height / 2);
                ctx.translate(panOffset.x, panOffset.y);

                // Grid removed

                const centerY = height / 2 - 60;
                const compX = width * 0.15; 
                
                const magnetBaseX = width * 0.65;
                const magnetX = magnetBaseX + magnetOffset.x;
                const magnetY = centerY + magnetOffset.y; 
                
                const spacing = 130;
                const batteryY = centerY - spacing; 
                const switchY = centerY;
                const ammeterY = centerY + spacing;

                const magnetLen = 280; 
                const magnetTopY = magnetY - magnetLen / 2;
                const magnetBottomY = magnetY + magnetLen / 2;
                
                const current = isSwitchClosed ? params.cells * 0.5 : 0;

                // --- PHYSICS UPDATE ---
                const pileY = height - 30; 
                const pileX = magnetBaseX; 
                
                const dx = pileX - magnetX;
                const dy = pileY - magnetBottomY;
                const distance = Math.sqrt(dx*dx + dy*dy);
                
                currentDistanceRef.current = distance;

                if (isSwitchClosed && params.core === 'iron') {
                    const nLevel = params.turns / 20;     
                    const iLevel = current / 0.5;  
                    const k = 2; 
                    const maxCapacity = k * Math.pow((nLevel * iLevel), 2);

                    let pickupRatio = 0;
                    if (distance < 180) {
                        pickupRatio = 1 - (distance / 180);
                    }
                    
                    const potentialClips = Math.floor(maxCapacity * pickupRatio);
                    const newHeld = Math.min(maxCapacity, Math.max(heldClipsRef.current, potentialClips));
                    
                    if (newHeld !== heldClipsRef.current) {
                        heldClipsRef.current = newHeld;
                        setClipCount(newHeld); 
                    }
                } else {
                    if (heldClipsRef.current > 0) {
                        heldClipsRef.current = 0;
                        setClipCount(0);
                    }
                }

                // Draw Circuit
                const coilLeftX = magnetX - 25; 
                const coilTopY = magnetTopY + 40; 
                const coilBottomY = magnetTopY + magnetLen - 60;

                drawFlexibleWire(ctx, { x: compX, y: batteryY - 50 }, { x: coilLeftX, y: coilTopY }, -100);
                drawThinWirePath(ctx, [{ x: compX, y: batteryY + 50 }, { x: compX, y: switchY - 30 }]);
                drawThinWirePath(ctx, [{ x: compX, y: switchY + 30 }, { x: compX, y: switchY + 60 }, { x: compX - 80, y: switchY + 60 }, { x: compX - 80, y: ammeterY }, { x: compX - 58, y: ammeterY }]);
                drawFlexibleWire(ctx, { x: compX + 58, y: ammeterY }, { x: coilLeftX, y: coilBottomY }, 100);

                drawVerticalBatteryHolder(ctx, compX, batteryY, params.cells); 
                drawVerticalSwitch(ctx, compX, switchY, isSwitchClosed);
                drawAmmeter(ctx, compX, ammeterY, current);

                drawVerticalCore(ctx, magnetX, magnetY, magnetLen, params.core);
                drawVerticalCoils(ctx, magnetX, magnetY, magnetLen, params.turns); 

                drawPaperClips(ctx, magnetBaseX, magnetX, magnetBottomY, height, heldClipsRef.current, time);

                requestRef.current = requestAnimationFrame(animate);
            };

            // Drawing helpers
            const drawThinWirePath = (ctx, points) => {
                if (points.length < 2) return;
                ctx.beginPath();
                ctx.moveTo(points[0].x, points[0].y);
                for (let i = 1; i < points.length; i++) {
                    ctx.lineTo(points[i].x, points[i].y);
                }
                ctx.lineCap = 'round'; ctx.lineJoin = 'round';
                ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 5; ctx.stroke(); 
                ctx.strokeStyle = '#dc2626'; ctx.lineWidth = 2.5; ctx.stroke(); 
            };

            const drawFlexibleWire = (ctx, start, end, curveControl) => {
                ctx.beginPath();
                ctx.moveTo(start.x, start.y);
                const midX = (start.x + end.x) / 2;
                const midY = (start.y + end.y) / 2 + curveControl; 
                ctx.quadraticCurveTo(midX, midY, end.x, end.y);
                ctx.lineCap = 'round'; ctx.lineJoin = 'round';
                ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 5; ctx.stroke(); 
                ctx.strokeStyle = '#dc2626'; ctx.lineWidth = 2.5; ctx.stroke(); 
            };

            const drawAmmeter = (ctx, x, y, current) => {
                const w = 100; const h = 80;
                drawThinWirePath(ctx, [{x: x - w/2 - 10, y: y}, {x: x - w/2, y: y}]); 
                drawThinWirePath(ctx, [{x: x + w/2, y: y}, {x: x + w/2 + 10, y: y}]); 
                ctx.fillStyle = '#facc15'; ctx.beginPath(); ctx.roundRect(x - w/2, y - h/2, w, h, 8); ctx.fill();
                ctx.strokeStyle = '#ca8a04'; ctx.lineWidth = 2; ctx.stroke();
                ctx.fillStyle = '#f0fdf4'; ctx.beginPath(); ctx.roundRect(x - w/2 + 10, y - h/2 + 10, w - 20, 30, 4); ctx.fill();
                ctx.strokeStyle = '#bbf7d0'; ctx.stroke();
                ctx.font = 'bold 20px font-mono'; ctx.fillStyle = '#166534'; ctx.textAlign = 'center'; ctx.fillText(`${current} A`, x, y - 10);
                ctx.font = '10px sans-serif'; ctx.fillStyle = '#854d0e'; ctx.fillText('AMMETER', x, y + 25);
            };

            const drawVerticalBatteryHolder = (ctx, x, y, count) => {
                const w = 60; const h = 100; 
                ctx.fillStyle = '#334155'; ctx.beginPath(); ctx.roundRect(x - w/2, y - h/2, w, h, 6); ctx.fill();
                ctx.fillStyle = '#1e293b'; ctx.beginPath(); ctx.roundRect(x - w/2 + 5, y - h/2 + 5, w - 10, h - 10, 4); ctx.fill();
                const cellW = 40; const cellH = 20; const spacing = 5;
                const startY = y - (count * cellH + (count - 1) * spacing) / 2 + cellH/2;
                for (let i = 0; i < count; i++) {
                    const cy = startY + i * (cellH + spacing);
                    const cx = x;
                    const batW = 24; const batH = 20; 
                    ctx.fillStyle = '#eab308'; ctx.beginPath(); ctx.roundRect(cx - batW/2, cy - batH/2, batW, batH, 2); ctx.fill();
                    ctx.fillStyle = '#cbd5e1'; ctx.beginPath(); ctx.moveTo(cx - 5, cy - batH/2); ctx.lineTo(cx + 5, cy - batH/2); ctx.lineTo(cx + 5, cy - batH/2 - 3); ctx.lineTo(cx - 5, cy - batH/2 - 3); ctx.fill();
                }
                ctx.fillStyle = '#ef4444'; ctx.beginPath(); ctx.arc(x, y - h/2, 4, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(x, y + h/2, 4, 0, Math.PI*2); ctx.fill();
                ctx.font = 'bold 9px sans-serif'; ctx.fillStyle = '#64748b'; ctx.textAlign = 'left'; ctx.fillText('BATTERY HOLDER', x + 45, y + 4);
            };

            const drawVerticalSwitch = (ctx, x, y, closed) => {
                const w = 40; const h = 80;
                ctx.fillStyle = '#334155'; ctx.fillRect(x - w/2, y - h/2, w, h);
                const topY = y - 30; const bottomY = y + 30;
                ctx.fillStyle = '#94a3b8'; ctx.beginPath(); ctx.arc(x, topY, 6, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(x, bottomY, 6, 0, Math.PI*2); ctx.fill(); 
                ctx.save(); ctx.translate(x, bottomY); const angle = closed ? 0 : -Math.PI / 4; ctx.rotate(angle);
                ctx.fillStyle = '#cbd5e1'; ctx.fillRect(-3, -60, 6, 60);
                ctx.fillStyle = closed ? '#22c55e' : '#ef4444'; ctx.beginPath(); ctx.arc(0, -65, 8, 0, Math.PI*2); ctx.fill();
                if (!closed) { ctx.strokeStyle = 'rgba(239, 68, 68, 0.4)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0, -65, 12, 0, Math.PI*2); ctx.stroke(); }
                ctx.restore();
                ctx.font = '10px sans-serif'; ctx.fillStyle = '#64748b'; ctx.textAlign = 'left'; ctx.fillText(closed ? 'SWITCH (ON)' : 'SWITCH (OFF)', x + 45, y + 4);
            };

            const drawVerticalCore = (ctx, x, centerY, len, type) => {
                const width = 30; 
                const topY = centerY - len/2;
                const bottomY = centerY + len/2;

                if (type === 'iron') {
                    ctx.fillStyle = '#94a3b8'; 
                    ctx.beginPath(); ctx.rect(x - width/2 - 5, topY - 10, width + 10, 10); ctx.fill(); 
                    ctx.beginPath(); ctx.rect(x - width/2, topY, width, len - 20); ctx.fill(); 
                    ctx.beginPath(); ctx.moveTo(x - width/2, bottomY - 20); ctx.lineTo(x + width/2, bottomY - 20); ctx.lineTo(x, bottomY); ctx.closePath(); ctx.fill(); 
                    const grad = ctx.createLinearGradient(x - width/2, topY, x + width/2, topY);
                    grad.addColorStop(0, 'rgba(0,0,0,0.2)'); grad.addColorStop(0.3, 'rgba(255,255,255,0.4)'); grad.addColorStop(1, 'rgba(0,0,0,0.2)');
                    ctx.fillStyle = grad; ctx.fillRect(x - width/2, topY, width, len - 20);
                    ctx.save(); ctx.beginPath(); ctx.moveTo(x - width/2, bottomY - 20); ctx.lineTo(x + width/2, bottomY - 20); ctx.lineTo(x, bottomY); ctx.clip();
                    ctx.fillStyle = grad; ctx.fillRect(x - width/2, bottomY - 20, width, 20); ctx.restore();
                } else {
                    ctx.fillStyle = '#a05a2c';
                    ctx.beginPath(); ctx.rect(x - width/2, topY, width, len); ctx.fill();
                    ctx.strokeStyle = '#713f12'; ctx.lineWidth = 1; ctx.stroke();
                    ctx.strokeStyle = 'rgba(0,0,0,0.15)'; ctx.lineWidth = 1; ctx.beginPath();
                    for(let i=0; i<5; i++) { const grainX = x - width/2 + 5 + i * 5; ctx.moveTo(grainX, topY + 5); ctx.lineTo(grainX, bottomY - 5); }
                    ctx.stroke();
                }
            };

            const drawVerticalCoils = (ctx, x, centerY, len, turns) => {
                const coilLen = len - 80;
                const startY = centerY - coilLen / 2;
                const endY = centerY + coilLen / 2;
                const spacing = coilLen / turns;
                const width = 34; 
                ctx.lineCap = 'round'; ctx.lineJoin = 'round';
                for (let i = 0; i < turns; i++) {
                    const y = startY + i * spacing;
                    ctx.lineWidth = 3; ctx.beginPath(); ctx.strokeStyle = '#b45309'; 
                    ctx.moveTo(x - width/2, y); ctx.quadraticCurveTo(x, y - 6, x + width/2, y + 4); ctx.stroke();
                    ctx.lineWidth = 3; ctx.beginPath(); ctx.strokeStyle = '#d97706'; ctx.shadowBlur = 0;
                    ctx.moveTo(x + width/2, y + 4); ctx.quadraticCurveTo(x, y + 10, x - width/2, y + spacing); ctx.stroke(); 
                }
                ctx.fillStyle = '#d1d5db';
                ctx.beginPath(); ctx.arc(x - width/2, startY + 4, 3, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(x - width/2, endY, 3, 0, Math.PI*2); ctx.fill();
            };

            const drawPaperClips = (ctx, pileX, magnetX, magnetBottomY, canvasH, count, time) => {
                const pileY = canvasH - 30; 
                ctx.fillStyle = '#94a3b8';
                for(let i=0; i<15; i++) {
                    ctx.save();
                    ctx.translate(pileX + (i-7)*10, pileY + (i % 2 === 0 ? 5 : 0)); 
                    ctx.rotate(Math.sin(i * 123) * 1.5); 
                    ctx.beginPath(); ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 2;
                    ctx.roundRect(-6, -12, 12, 24, 6); ctx.stroke(); ctx.restore();
                }
                if (count > 0) {
                    const visualCount = Math.min(count, 25);
                    let currentX = magnetX;
                    let currentY = magnetBottomY + 2; 
                    ctx.fillStyle = '#e2e8f0'; ctx.strokeStyle = '#64748b'; ctx.lineWidth = 1.5;
                    for (let i = 0; i < visualCount; i++) {
                        const sway = Math.sin(time * 0.003 + i * 0.5) * (i * 0.5);
                        const drawX = currentX + sway;
                        const drawY = currentY;
                        ctx.beginPath(); ctx.ellipse(drawX, drawY + 10, 6, 12, 0, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();
                        ctx.beginPath(); ctx.moveTo(drawX - 2, drawY + 4); ctx.lineTo(drawX - 2, drawY + 16); ctx.stroke();
                        if (i > 3 && i % 3 === 0) currentX += 6;
                        else if (i > 3 && i % 3 === 1) currentX -= 6;
                        currentY += 14;
                    }
                }
            };

            useEffect(() => {
                const handleResize = () => {
                    const canvas = canvasRef.current;
                    const parent = canvas.parentElement;
                    if (canvas && parent) {
                        canvas.width = parent.clientWidth;
                        canvas.height = parent.clientHeight;
                        setCanvasSize({ w: parent.clientWidth, h: parent.clientHeight });
                        requestAnimationFrame(animate); 
                    }
                };
                window.addEventListener('resize', handleResize);
                handleResize();
                return () => window.removeEventListener('resize', handleResize);
            }, []); 

            useEffect(() => {
                requestRef.current = requestAnimationFrame(animate);
                return () => cancelAnimationFrame(requestRef.current);
            }, [params, clipCount, isSwitchClosed, panOffset, isHoveringSwitch, isHoveringMagnet, magnetOffset, heldClipsRef.current]); 

            const resetSimulation = () => {
                setParams({ turns: 20, cells: 1, core: 'iron' });
                setIsSwitchClosed(false);
                setPanOffset({ x: 0, y: 0 });
                setMagnetOffset({ x: 0, y: 0 });
                heldClipsRef.current = 0;
                setClipCount(0);
            };

            return (
                <div className="flex flex-col h-screen bg-white text-slate-800 font-sans selection:bg-blue-100 overflow-hidden">
                    <header className="flex items-center justify-between px-6 py-3 bg-white border-b border-slate-200 shadow-sm z-20 relative">
                        <div className="flex items-center gap-4">
                            <div className="bg-orange-600 text-white p-1.5 rounded-md"><Zap size={20} /></div>
                            <h1 className="text-xl font-bold tracking-tight text-slate-800 select-none">
                                Investigate the factors affecting the strength of electromagnet
                            </h1>
                        </div>
                    </header>

                    <div className="flex flex-1 overflow-hidden relative" ref={containerRef}>
                        <aside className="flex flex-col bg-slate-50 border-r border-slate-200 z-10 shrink-0 h-full w-80 shadow-xl lg:shadow-none relative">
                            <div className="p-5 flex-1 overflow-y-auto custom-scrollbar">
                                <h2 className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-6 flex items-center gap-2">
                                    <Settings size={14} /> Control Panel
                                </h2>
                                <div className="space-y-8">
                                    <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                                        <label className="text-sm font-semibold text-slate-700 mb-3 block">Number of Turns</label>
                                        <div className="grid grid-cols-3 gap-2">
                                            {[20, 40, 60].map((val) => (
                                                <button key={val} onClick={() => handleParamChange('turns', val)} className={`py-2 px-1 text-sm rounded-lg border font-medium transition-colors ${params.turns === val ? 'bg-orange-600 border-orange-600 text-white' : 'bg-white border-slate-200 text-slate-600 hover:bg-slate-50'}`}>{val}</button>
                                            ))}
                                        </div>
                                    </div>
                                    <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                                        <label className="text-sm font-semibold text-slate-700 mb-3 block">Number of Cells</label>
                                        <div className="grid grid-cols-3 gap-2">
                                            {[1, 2, 3].map((val) => (
                                                <button key={val} onClick={() => handleParamChange('cells', val)} className={`py-2 px-1 text-sm rounded-lg border font-medium transition-colors ${params.cells === val ? 'bg-orange-600 border-orange-600 text-white' : 'bg-white border-slate-200 text-slate-600 hover:bg-slate-50'}`}>{val} {val === 1 ? 'Cell' : 'Cells'}</button>
                                            ))}
                                        </div>
                                        <p className="text-[10px] text-slate-400 mt-2 italic text-center">Controls current (1 Cell ≈ 0.5A)</p>
                                    </div>
                                    <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                                        <label className="text-sm font-semibold text-slate-700 mb-3 block">Core Material</label>
                                        <div className="grid grid-cols-2 gap-2">
                                            {[ { id: 'iron', label: 'Iron Nail' }, { id: 'wood', label: 'Wood' } ].map((item) => (
                                                <button key={item.id} onClick={() => handleParamChange('core', item.id)} className={`py-2 text-sm rounded-lg border font-medium transition-colors ${params.core === item.id ? 'bg-slate-700 border-slate-700 text-white' : 'bg-white border-slate-200 text-slate-600 hover:bg-slate-50'}`}>{item.label}</button>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div className="p-4 border-t border-slate-200 bg-slate-50">
                                <button onClick={handleRecord} className="flex items-center justify-center gap-2 w-full py-2.5 bg-blue-600 border border-blue-700 rounded-lg text-white font-semibold hover:bg-blue-700 shadow-sm transition-colors"><Save size={18} /> Record Result</button>
                            </div>
                        </aside>

                        <main className="flex-1 flex flex-col bg-slate-50 overflow-hidden relative">
                            <div className="flex-1 relative overflow-hidden bg-slate-100 border-b border-slate-200">
                                <div className="absolute top-4 left-4 z-30 flex gap-1 bg-white border border-slate-200 rounded-lg shadow-sm p-1">
                                    <button onClick={() => setToolMode('select')} className={`p-2 rounded transition-all ${toolMode === 'select' ? 'bg-blue-100 text-blue-600' : 'text-slate-500 hover:bg-slate-100'}`} title="Selection Tool"><MousePointer2 size={20} /></button>
                                    <button onClick={() => setToolMode('pan')} className={`p-2 rounded transition-all ${toolMode === 'pan' ? 'bg-blue-100 text-blue-600' : 'text-slate-500 hover:bg-slate-100'}`} title="Pan View"><Hand size={20} /></button>
                                </div>
                                <canvas ref={canvasRef} onMouseDown={handleCanvasMouseDown} onMouseMove={handleCanvasMouseMove} onMouseUp={handleCanvasMouseUp} onMouseLeave={handleCanvasMouseLeave} className={`w-full h-full block ${getCursorClass()}`} />
                            </div>
                            <div className="h-64 bg-white flex flex-col shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)] z-20">
                                <div className="px-6 py-3 border-b border-slate-200 flex justify-between items-center bg-slate-50">
                                    <h3 className="font-bold text-slate-700 flex items-center gap-2"><Settings size={16} /> Data Log</h3>
                                    <button onClick={handleClearData} className="text-xs font-semibold text-red-500 hover:text-red-700 flex items-center gap-1 px-3 py-1.5 rounded hover:bg-red-50 transition-colors"><Trash2 size={14} /> Clear Table</button>
                                </div>
                                <div className="flex-1 overflow-auto">
                                    <table className="w-full text-sm text-left">
                                        <thead className="text-xs text-slate-500 uppercase bg-slate-50 sticky top-0 shadow-sm">
                                            <tr>
                                                <th className="px-6 py-3 font-semibold">Turn No.</th>
                                                <th className="px-6 py-3 font-semibold">Cells</th>
                                                <th className="px-6 py-3 font-semibold">Current (A)</th>
                                                <th className="px-6 py-3 font-semibold">Core</th>
                                                <th className="px-6 py-3 font-semibold">Distance</th>
                                                <th className="px-6 py-3 font-semibold text-right">Clips Lifted</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-100">
                                            {dataLog.map((row) => (
                                                <tr key={row.id} className="hover:bg-slate-50 transition-colors">
                                                    <td className="px-6 py-3 font-medium text-slate-700">{row.turns}</td>
                                                    <td className="px-6 py-3 text-slate-600">{row.cells}</td>
                                                    <td className="px-6 py-3 text-slate-600 font-mono">{row.current}</td>
                                                    <td className="px-6 py-3 text-slate-600 capitalize">{row.core}</td>
                                                    <td className="px-6 py-3 text-slate-600">{row.distance}</td>
                                                    <td className="px-6 py-3 text-right font-bold text-blue-600">{row.clips}</td>
                                                </tr>
                                            ))}
                                            <tr className="bg-blue-50/50 hover:bg-blue-50 transition-colors border-t-2 border-blue-100">
                                                <td className="px-6 py-3 font-bold text-blue-700 relative">{params.turns}<span className="absolute top-1 left-2 text-[8px] text-blue-400 uppercase tracking-widest font-bold">LIVE</span></td>
                                                <td className="px-6 py-3 text-blue-700 font-medium">{params.cells}</td>
                                                <td className="px-6 py-3 text-blue-700 font-mono font-medium">{liveCurrent}</td>
                                                <td className="px-6 py-3 text-blue-700 capitalize font-medium">{params.core}</td>
                                                <td className="px-6 py-3 text-blue-700 font-medium">{liveDistance}</td>
                                                <td className="px-6 py-3 text-right font-extrabold text-blue-700 text-lg">{clipCount}</td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </main>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<SimulationLayout />);
    </script>
</body>
</html>
